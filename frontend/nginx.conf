map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin /api -> FastAPI (compose service "api"), incl. WebSocket
    # upgrades for live container logs and exec terminals (long-lived).
    location /api/ {
        # Track VELA_VOLUME_UPLOAD_MAX_BYTES (default 100m) so the app's 413, not nginx's, is returned.
        client_max_body_size 105m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build output: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for client-side routes: never heuristic-cache the entry.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
