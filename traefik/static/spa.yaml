http:
  middlewares:
    # Referenced by the websecure entrypoint in docker-compose.yml: HSTS on all
    # TLS-routed traffic (SPA + /api proxy), not just the routers defined here.
    vela-hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
  routers:
    # Plain HTTP, unchanged from before TLS was added.
    vela-spa:
      rule: "PathPrefix(`/`)"
      service: vela-spa-svc
      entryPoints:
        - web
    # Same route over TLS. Separate router because a router with `tls` enabled
    # will not also serve plain HTTP on its entryPoints.
    vela-spa-tls:
      rule: "PathPrefix(`/`)"
      service: vela-spa-svc
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
        # The rule has no Host matcher, so Traefik cannot infer which name to
        # issue for. Comes from VELA_DOMAIN (passed to the traefik service in
        # docker-compose.yml); must match VELA_FRONTEND_BASE_URL / OAuth redirect.
        domains:
          - main: '{{ env "VELA_DOMAIN" }}'
  services:
    vela-spa-svc:
      loadBalancer:
        servers:
          - url: "http://web:8080"
