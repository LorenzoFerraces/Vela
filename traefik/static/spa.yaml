http:
  middlewares:
    # Referenced by the websecure entrypoint in docker-compose.yml: HSTS on all
    # TLS-routed traffic (SPA + /api proxy), not just the routers defined here.
    vela-hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
    vela-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
  routers:
    # Redirect the public host to HTTPS. Higher priority than the catch-all
    # plain-HTTP router below. Host/certResolver come from env on the traefik
    # container (Go templates — this is a dynamic file-provider config).
    vela-redirect:
      rule: 'Host(`{{ env "VELA_PUBLIC_HOST" }}`)'
      service: vela-spa-svc
      entryPoints:
        - web
      middlewares:
        - vela-https-redirect
      priority: 100
    # Catch-all plain HTTP (local health checks, hosts other than the public one).
    vela-spa:
      rule: "PathPrefix(`/`)"
      service: vela-spa-svc
      entryPoints:
        - web
    # Same route over TLS. Separate router because a router with `tls` enabled
    # will not also serve plain HTTP on its entryPoints.
    vela-spa-tls:
      rule: "PathPrefix(`/`)"
      service: vela-spa-svc
      entryPoints:
        - websecure
      tls:
        certResolver: '{{ env "VELA_TRAEFIK_ACME_RESOLVER" }}'
        # The rule has no Host matcher, so Traefik cannot infer which name to
        # issue for. Comes from VELA_PUBLIC_HOST (passed to the traefik service
        # in docker-compose.yml); must match VELA_FRONTEND_BASE_URL / OAuth redirect.
        domains:
          - main: '{{ env "VELA_PUBLIC_HOST" }}'
  services:
    vela-spa-svc:
      loadBalancer:
        servers:
          - url: "http://web:8080"
