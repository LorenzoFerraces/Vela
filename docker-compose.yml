# Vela full stack: API + SPA + Postgres + Traefik.
#
#   cp .env.example .env   # then fill in the required values
#   docker compose up -d --build
#
# The API drives the HOST Docker daemon through a bind-mounted socket, so
# workload containers run on the host engine and join the `vela-workloads`
# network. Traefik is attached to that same network, which is what lets public
# routes reach workloads. Stack networks (`vela-stack-*`) are joined by the API.
# Works from Windows (Docker Desktop) or WSL2: the api entrypoint aligns the
# socket's group with its in-image docker group on start.

name: vela

services:
  postgres:
    image: postgres:16
    container_name: vela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vela}
      POSTGRES_DB: ${POSTGRES_DB:-Vela}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vela} -d ${POSTGRES_DB:-Vela}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  migrate:
    build:
      context: ./backend
      args:
        DOCKER_GROUP_ID: ${DOCKER_GROUP_ID:-999}
    image: vela/api
    command: ["alembic", "upgrade", "head"]
    container_name: vela-migrate
    env_file:
      - path: .env
        required: false
    environment:
      VELA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vela}:${POSTGRES_PASSWORD:-vela}@postgres:5432/${POSTGRES_DB:-Vela}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      args:
        DOCKER_GROUP_ID: ${DOCKER_GROUP_ID:-999}
    image: vela/api
    container_name: vela-api
    # Starts as root so the entrypoint can align the mounted socket's group
    # with the in-image docker group on any host layout (Docker Desktop
    # root:root sockets, non-default docker GIDs), then drops to `vela`.
    # Set VELA_API_CONTAINER_USER=vela to skip alignment (then the image's
    # docker GID must already match the host socket's GID).
    user: ${VELA_API_CONTAINER_USER:-root}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      VELA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vela}:${POSTGRES_PASSWORD:-vela}@postgres:5432/${POSTGRES_DB:-Vela}
      VELA_TRAEFIK_DYNAMIC_FILE: /etc/traefik/dynamic/traefik-http.yml
      VELA_TRAEFIK_RELOAD_CONTAINER: vela-traefik
      VELA_DOCKER_NETWORK: vela-workloads
      VELA_VOLUME_UPLOADS_DIR: ${VELA_VOLUME_UPLOADS_DIR:-/data/volume-uploads}
      VELA_VOLUME_UPLOADS_HOST_DIR: ${VELA_VOLUME_UPLOADS_HOST_DIR:-}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Named volume by default: a fresh Linux host no longer creates a
      # root-owned bind. When VELA_VOLUME_UPLOADS_HOST_DIR is set, use that
      # pre-created host dir instead so workloads mount the same source the
      # backend advertises (see .env.example).
      - ${VELA_VOLUME_UPLOADS_HOST_DIR:-volume_uploads}:${VELA_VOLUME_UPLOADS_DIR:-/data/volume-uploads}
      - traefik_dynamic:/etc/traefik/dynamic
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: vela-web
    restart: unless-stopped
    ports:
      - "${VELA_WEB_PORT:-8081}:8080"
    environment:
      VELA_VOLUME_UPLOAD_MAX_BYTES: ${VELA_VOLUME_UPLOAD_MAX_BYTES:-104857600}
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx-source.conf:ro
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=0755
    entrypoint:
      - /bin/sh
      - -c
      - |
        max_mb=$$(( $${VELA_VOLUME_UPLOAD_MAX_BYTES:-104857600} / 1048576 + 5 ))
        sed "s/client_max_body_size 105m;/client_max_body_size $${max_mb}m;/" \
          /etc/nginx/nginx-source.conf > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      api:
        condition: service_healthy

  traefik:
    image: traefik:v3.2
    container_name: vela-traefik
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${VELA_TRAEFIK_ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Staging resolver for testing cert issuance without rate limits.
      - --certificatesresolvers.staging.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.staging.acme.email=${VELA_TRAEFIK_ACME_EMAIL:-}
      - --certificatesresolvers.staging.acme.storage=/letsencrypt/acme-staging.json
      - --certificatesresolvers.staging.acme.httpchallenge=true
      - --certificatesresolvers.staging.acme.httpchallenge.entrypoint=web
      # Dashboard off by default. Both flags gated by the same opt-in var.
      - --api.dashboard=${VELA_TRAEFIK_DASHBOARD:-false}
      - --api.insecure=${VELA_TRAEFIK_DASHBOARD:-false}
    environment:
      VELA_PUBLIC_HOST: ${VELA_PUBLIC_HOST:-app.example.com}
      VELA_TRAEFIK_ACME_RESOLVER: ${VELA_TRAEFIK_ACME_RESOLVER:-letsencrypt}
    ports:
      - "80:80"
      - "443:443"
      # Loopback-only dashboard port; the dashboard itself is disabled unless
      # VELA_TRAEFIK_DASHBOARD=1. Never exposed on the public entrypoints.
      - "127.0.0.1:8080:8080"
    volumes:
      - traefik_dynamic:/etc/traefik/dynamic
      - ./traefik/static/spa.yaml:/etc/traefik/dynamic/spa.yaml:ro
      - traefik_certs:/letsencrypt
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - default
      - workloads
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  traefik_dynamic:
  traefik_certs:
  volume_uploads:

networks:
  workloads:
    name: vela-workloads
