[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "vela"
version = "0.1.0"
description = "Container deployment platform — orchestrate, build, and manage containers from a single interface."
requires-python = ">=3.12"
# Exact pins: CI installs from this manifest, so lint/typecheck results and
# runtime behaviour are reproducible. Bump deliberately when updating.
dependencies = [
    "docker==7.2.0",
    "pydantic[email]==2.14.4",
    "python-dotenv==1.2.4",
    "fastapi==0.165.0",
    "python-multipart==0.0.34",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "brevo-python==4.0.10",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "bcrypt==5.0.0",
    "pyjwt==2.15.1",
    "cryptography==45.0.7",
    "boto3==1.44.9",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "aiosqlite==0.22.1",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "docker",
    "docker.*",
    "yaml",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "s3transfer",
    "s3transfer.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
